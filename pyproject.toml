[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-app"
version = "0.1.0"
description = "Azure Cognitive Services TTS Web App"
requires-python = ">=3.10"
dependencies = [
    "azure-cognitiveservices-speech>=1.37.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]

[project.scripts]
tts = "tts_app.main:main"
tts-app = "tts_app.run:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/tts_app"]
